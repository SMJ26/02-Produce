services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cutline
      POSTGRES_PASSWORD: cutline-local
      POSTGRES_DB: cutline
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - cutline-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cutline -d cutline"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  cutline-db:
